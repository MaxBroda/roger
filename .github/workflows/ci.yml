name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Roger builds against the macOS 26 Speech framework; older runner images do
    # not know `SpeechAnalyzer` and fail to compile. Pinning the version rather
    # than using `macos-latest` is deliberate — a rolling label would silently
    # move the floor under the build.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Version melden
        run: swift --version
      - name: Bauen
        run: swift build -c release
      - name: Tests
        run: swift test
